<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spintellect</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/titlepage.css" />
    <link rel="stylesheet" href="styles/game.css" />
    <link rel="stylesheet" href="styles/wheel.css" />
    <!-- keep state.js at the top of the scripts so it loads first -->
    <script defer src="js/state.js"></script>
    <!-- question banks -->
    <script defer src="questions/art-literature.js"></script>
    <script defer src="questions/film-tv.js"></script>
    <script defer src="questions/music.js"></script>
    <script defer src="questions/technology.js"></script>
    <script defer src="questions/culture-tradition.js"></script>
    <script defer src="questions/food-drink.js"></script>
    <script defer src="questions/general-knowledge.js"></script>
    <script defer src="questions/geography.js"></script>
    <script defer src="questions/history.js"></script>
    <script defer src="questions/maths.js"></script>
    <script defer src="questions/nature.js"></script>
    <script defer src="questions/science.js"></script>
    <script defer src="questions/sports.js"></script>
    <script defer src="questions/videogames.js"></script>
    <!-- add new files here -->
    <script defer src="js/titlepage.js"></script>
    <script defer src="js/quiz-render.js"></script>
    <script defer src="js/game.js"></script>
    <script defer src="js/category-select.js"></script>

    <!-- keep main.js at the end of the scripts so it loads last -->
    <script defer src="js/main.js"></script>
  </head>
  <body>
    <!-- START QUIZ Title Page -->
    <main id="title-screen" data-screen>
      <video autoplay muted loop playsinline id="background-video">
        <source src="assets/videos/245751.mp4" type="video/mp4" />
      </video>

      <audio id="background-music" loop>
        <source src="assets/sounds/christmas-theme.mp3" type="audio/mpeg" />
      </audio>

      <button
        type="button"
        id="music-toggle"
        aria-label="Turn music on"
        aria-pressed="false"
      >
        🎵
      </button>

      <img
        src="assets/images/SpintellectLogo.svg"
        alt="Spintellect logo"
        class="game-logo"
      />

      <form id="playerForm">
        <input
          type="text"
          id="playerName"
          name="playerName"
          placeholder="Enter your name"
          required
        />

        <button type="submit" id="startGame">Start Game</button>
      </form>

      <div id="highestScoreDisplay">
        <h3>
          Highest Score:
          <span id="highestScore">0</span>
        </h3>
      </div>
    </main>
    <!-- END QUIZ Title Page -->

    <!-- START WHEEL SCREEN ELEMENTS -->
    <div id="wheel-screen" data-screen hidden>
      <div class="wheel-wrapper">
        <header class="top-bar">
          <span class="level"
            >Level <span id="wheel-level-display">1</span></span
          >

          <span class="money"
            >Money: $<span id="wheel-money-display">0</span></span
          >

          <div class="lives">
            <span>Lives:</span>
            <div class="hearts" id="wheel-lives-display" role="img"></div>
          </div>
        </header>

        <div class="wheel-card">
          <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel-canvas" width="400" height="400"></canvas>
          </div>

          <h2 id="selected-category-display">
            Spin the wheel to choose a category!
          </h2>

          <button type="button" id="spin-button">Spin Wheel</button>

          <div id="wheel-actions" hidden>
            <button type="button" id="confirm-category-btn">Start Round</button>
            <button type="button" id="respin-btn">Spin Again ($200)</button>
          </div>
        </div>
      </div>
    </div>
    <!-- END WHEEL SCREEN ELEMENTS -->

    <!-- START QUIZ SCREEN ELEMENTS -->

    <div id="game-container" data-screen hidden>
      <h1 class="visually-hidden">Spintellect</h1>
      <div id="quiz-screen">
        <header class="top-bar">
          <span class="level">Level <span id="level-display"></span></span>

          <span class="money">Money: $<span id="money-display">0</span></span>

          <div class="lives">
            <span>Lives:</span>
            <div class="hearts" id="lives-display" role="img"></div>
          </div>
        </header>

        <section class="question-card">
          <div id="question-view">
            <p class="timer" id="timer" role="timer">
              <span id="timer-display"></span>s
            </p>
            <p class="question">
              <span class="question-mark" aria-hidden="true">?</span>
              <span id="question-text"></span>
            </p>
            <div id="options-container"></div>
          </div>

          <div id="result-view" hidden>
            <p class="question">
              <span class="question-mark" aria-hidden="true">!</span>
              <span id="result-title"></span>
            </p>
            <p id="result-message"></p>
            <div id="result-actions"></div>
          </div>
        </section>

        <footer class="round-info" id="round-info">
          <span id="category-label"></span>
          <span id="question-counter"></span>
        </footer>
      </div>
      <!-- END QUIZ SCREEN ELEMENTS -->
    </div>
  </body>
</html>
